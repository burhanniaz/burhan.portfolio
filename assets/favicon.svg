<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="M. Burhan">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="c1"/>
      <stop offset="1" class="c2"/>
    </linearGradient>
    <style>
      /* mirrors --accent / --accent-2 / --accent-ink in css/style.css */
      .c1{ stop-color:#B5690A; }
      .c2{ stop-color:#0B7A6E; }
      .ink{ fill:#FFFFFF; }
      @media (prefers-color-scheme: dark){
        .c1{ stop-color:#E8A33D; }
        .c2{ stop-color:#3FCFC0; }
        .ink{ fill:#1B1006; }
      }
    </style>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#g)"/>

  <!-- geometric "B": outer silhouette plus two knocked-out counters -->
  <path class="ink" fill-rule="evenodd"
        d="M20 14 L31 14 A9 9 0 0 1 31 32 L34 32 A9 9 0 0 1 34 50 L20 50 Z
           M27.5 21 L30 21 A3 3 0 0 1 30 27 L27.5 27 Z
           M27.5 37 L31 37 A3 3 0 0 1 31 43 L27.5 43 Z"/>
</svg>
